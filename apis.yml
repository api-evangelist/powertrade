aid: powertrade
name: PowerTrade
description: 'PowerTrade (power.trade) is a crypto derivatives exchange offering European-style,
  USDC-settled options on BTC, ETH and 80+ altcoins, plus perpetual futures, spot, and tokenized
  equity (xStocks) options. For programmatic traders it publishes a public REST API (market
  data, history, positions, balances), real-time WebSocket market-data and position feeds, and
  a FIX 4.4 order-entry / drop-copy gateway. Private endpoints authenticate with an ES256 JWT
  signed from an account API key and private key. The exchange runs production, test and dev
  environments and provides Go, Python and TypeScript example clients on GitHub. Backed by
  Pantera Capital.'
